name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - 'features/**'

  pull_request:
    branches: [main]

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Build API
        run: pnpm run build

      - name: Type check (src + tests)
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        if: github.ref == 'refs/heads/main'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  Docker:
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.ref == 'refs/heads/main'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: github.ref == 'refs/heads/main'
        with:
          context: .
          tags: lionelschiepers/stockquote-node-api:github-latest
          push: true

      - name: Docker Scout Quickview
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        if: github.ref == 'refs/heads/main'
        with:
          command: quickview
          image: lionelschiepers/stockquote-node-api:github-latest

      - name: Docker Scout CVEs with SARIF output
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        if: github.ref == 'refs/heads/main'
        with:
          command: cves
          image: lionelschiepers/stockquote-node-api:github-latest
          sarif-file: report.sarif
          only-fixed: true
          ignore-base: false
          only-severities: 'critical,high,medium'

      - name: Docker Scout SBOM
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        if: github.ref == 'refs/heads/main'
        with:
          command: sbom
          image: lionelschiepers/stockquote-node-api:github-latest
          output: sbom.json

      - name: Docker Scout Recommendations
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        if: github.ref == 'refs/heads/main'
        with:
          command: recommendations
          image: lionelschiepers/stockquote-node-api:github-latest

      - name: Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        if: github.ref == 'refs/heads/main'
        with:
          image-ref: 'lionelschiepers/stockquote-node-api:github-latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy SARIF Report
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: github.ref == 'refs/heads/main'
        with:
          sarif_file: trivy-results.sarif

      - name: Publish SARIF Report as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main'
        with:
          name: sarif-report
          path: report.sarif

      #    - name: Cat sarif
      #      run: |
      #        find . -name "sarif.output.json"
      #        cat sarif.output.json

      - name: Upload Docker Scout SARIF Report
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: github.ref == 'refs/heads/main'
        with:
          sarif_file: report.sarif

      - name: Check for Critical Vulnerabilities
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Checking for critical vulnerabilities..."
          # Add logic to fail build if critical vulnerabilities are found
          # This would require parsing the SARIF files or using a dedicated tool
          echo "Vulnerability check completed"
