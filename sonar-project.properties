sonar.projectKey=lionelschiepers_StockQuotes.API
sonar.organization=lionelschiepers


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=StockQuotes.API
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# JavaScript/TypeScript specific settings
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Test coverage exclusions
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/__tests__/**,**/__mocks__/**,**/tests/**

# Source file exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/__tests__/**,**/__mocks__/**,**/tests/**

# Test file patterns
sonar.test.inclusions=**/tests/**/*.test.ts,**/__tests__/**/*.ts,**/*.test.ts,**/*.spec.ts